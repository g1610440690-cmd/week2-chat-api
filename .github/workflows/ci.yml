# 推送到 GitHub 后自动运行：安装依赖 -> 跑 10 个接口测试
# 测试用的是 SQLite，不需要数据库服务，任何机器都能跑
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 运行测试
        run: pytest -v
